services:
  db:
    image: postgres:15
    container_name: odoo17_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configurez DB_PASSWORD dans .env}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17.0
    container_name: odoo17_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD:?Configurez DB_PASSWORD dans .env}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?Configurez ODOO_MASTER_PASSWORD dans .env}
      OPTIKA_DB: ${OPTIKA_DB:-optika_demo}
      OPTIKA_ALLOWED_ORIGINS: ${OPTIKA_ALLOWED_ORIGINS:-}
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./config/bootstrap.py:/opt/optika/bootstrap.py:ro
      - odoo_web_data:/var/lib/odoo
    entrypoint: ["python3", "/opt/optika/bootstrap.py"]
    command: ["odoo"]

volumes:
  odoo_db_data:
  odoo_web_data:
